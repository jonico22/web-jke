server {
    listen 80;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Intenta servir el archivo solicitado, si no es una carpeta, 
        # y si no existe, muestra el 404 de Astro.
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}